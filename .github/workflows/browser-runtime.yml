name: Browser Runtime

on:
  push:
    branches: [main]
    paths:
      - ci/browser-runtime/**
      - .github/workflows/browser-runtime.yml
  pull_request:
    paths:
      - ci/browser-runtime/**
      - .github/workflows/browser-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned runtime
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build multi-platform runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci/browser-runtime
          file: ci/browser-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

  publish:
    name: Publish pinned runtime
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          echo "tag=ghcr.io/randroids-dojo/vibebots-ci:sha-$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-platform runtime
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci/browser-runtime
          file: ci/browser-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tag }}

      - name: Record immutable runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Browser runtime"
            echo ""
            echo "\`$TAG@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
