name: Browser Runtime

on:
  push:
    branches: [main]
    paths:
      - ci/browser-runtime/**
      - .github/workflows/browser-runtime.yml
  pull_request:
    paths:
      - ci/browser-runtime/**
      - .github/workflows/browser-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish pinned runtime
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sha="$HEAD_SHA"
          else
            sha="$WORKFLOW_SHA"
          fi
          echo "tag=ghcr.io/randroids-dojo/vibebots-ci:sha-$sha" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-platform runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ci/browser-runtime
          file: ci/browser-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tag }}

      - name: Record immutable runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          test -n "$DIGEST"
          echo "### Browser runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Make repository runtime publicly pullable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            /orgs/${{ github.repository_owner }}/packages/container/vibebots-ci \
            -f visibility=public
