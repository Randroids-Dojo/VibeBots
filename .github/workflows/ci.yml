name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full Playwright smoke matrix
        required: false
        default: "true"
      update_visual_baselines:
        description: Regenerate visual regression baselines (uploads artifact)
        required: false
        default: "false"
      full_e2e_global_timeout_ms:
        description: Override the Full E2E Playwright global timeout in ms (blank = auto from remaining job budget; set low to prove a timeout concludes as failure with artifacts)
        required: false
        default: ""
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dash check
        run: bash scripts/check-dashes.sh

      - name: Sim purity check
        run: bash scripts/check-sim-purity.sh

      - name: Whitespace check
        run: git diff --check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e-critical:
    name: Critical E2E (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            shard_name: 1-of-2
          - shard: "2/2"
            shard_name: 2-of-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Critical E2E smoke tests
        run: pnpm test:e2e:critical --project=chromium --fully-parallel --workers=1 --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ matrix.shard_name }}
          path: playwright-report/
          retention-days: 7

  e2e-full:
    name: Full E2E (${{ matrix.shard_name }})
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/32"
            shard_name: 1-of-32
          - shard: "2/32"
            shard_name: 2-of-32
          - shard: "3/32"
            shard_name: 3-of-32
          - shard: "4/32"
            shard_name: 4-of-32
          - shard: "5/32"
            shard_name: 5-of-32
          - shard: "6/32"
            shard_name: 6-of-32
          - shard: "7/32"
            shard_name: 7-of-32
          - shard: "8/32"
            shard_name: 8-of-32
          - shard: "9/32"
            shard_name: 9-of-32
          - shard: "10/32"
            shard_name: 10-of-32
          - shard: "11/32"
            shard_name: 11-of-32
          - shard: "12/32"
            shard_name: 12-of-32
          - shard: "13/32"
            shard_name: 13-of-32
          - shard: "14/32"
            shard_name: 14-of-32
          - shard: "15/32"
            shard_name: 15-of-32
          - shard: "16/32"
            shard_name: 16-of-32
          - shard: "17/32"
            shard_name: 17-of-32
          - shard: "18/32"
            shard_name: 18-of-32
          - shard: "19/32"
            shard_name: 19-of-32
          - shard: "20/32"
            shard_name: 20-of-32
          - shard: "21/32"
            shard_name: 21-of-32
          - shard: "22/32"
            shard_name: 22-of-32
          - shard: "23/32"
            shard_name: 23-of-32
          - shard: "24/32"
            shard_name: 24-of-32
          - shard: "25/32"
            shard_name: 25-of-32
          - shard: "26/32"
            shard_name: 26-of-32
          - shard: "27/32"
            shard_name: 27-of-32
          - shard: "28/32"
            shard_name: 28-of-32
          - shard: "29/32"
            shard_name: 29-of-32
          - shard: "30/32"
            shard_name: 30-of-32
          - shard: "31/32"
            shard_name: 31-of-32
          - shard: "32/32"
            shard_name: 32-of-32
    steps:
      # Anchor for the internal Playwright deadline (F-131). The whole job has a
      # 35-minute budget; the deadline is computed from how much of it remains
      # right before the tests run, so a slow or hung shard fails with a report
      # instead of being cancelled at the job deadline with zero evidence.
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Compute the Playwright global timeout from the job budget left after the
      # setup and build steps, reserving time for teardown, the HTML report, and
      # the artifact upload (F-131). A blank dispatch override auto-computes; a
      # low override forces a timeout to prove the failure-with-artifacts path.
      - name: Compute Playwright global timeout
        id: e2e_deadline
        env:
          OVERRIDE_MS: ${{ inputs.full_e2e_global_timeout_ms }}
        run: |
          set -euo pipefail
          job_budget_s=$(( 35 * 60 ))     # matches this job's timeout-minutes: 35
          reserve_s=150                    # teardown + HTML/JSON report + artifact upload
          # Minimum non-zero deadline. Its only job is to stay above 0, because
          # Playwright treats globalTimeout: 0 as "unlimited", which would put
          # the cancel-at-job-deadline problem right back. Deliberately tiny (not
          # 30s): when the safe budget is exhausted the wall-clock left may be
          # only seconds, and a large floor could exceed it and re-create a
          # cancel. safe_ms = wall-clock-left - reserve, so it never exceeds the
          # wall-clock left when positive; a 1s floor fails fast and still leaves
          # the remaining budget for the report and upload.
          floor_ms=1000
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          safe_ms=$(( (job_budget_s - reserve_s - elapsed_s) * 1000 ))
          if [ "$safe_ms" -lt "$floor_ms" ]; then safe_ms=$floor_ms; fi
          if [ -n "$OVERRIDE_MS" ]; then
            # Manual proof knob. Require a positive integer of 1 to 10 digits: the
            # first-digit [1-9] rejects 0 and leading zeros (a 0 would mean
            # unlimited), and the 10-digit cap keeps the value inside int64 for
            # the shell comparison below. Then clamp DOWN to the safe budget so a
            # too-large override cannot re-introduce a cancel.
            if [[ ! "$OVERRIDE_MS" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "full_e2e_global_timeout_ms must be a positive integer of 1 to 10 digits (milliseconds)" >&2
              exit 1
            fi
            if [ "$OVERRIDE_MS" -lt "$safe_ms" ]; then
              deadline_ms=$OVERRIDE_MS
            else
              deadline_ms=$safe_ms
            fi
            echo "Override ${OVERRIDE_MS}ms; using ${deadline_ms}ms (safe budget ${safe_ms}ms)"
          else
            deadline_ms=$safe_ms
            echo "Elapsed ${elapsed_s}s; Playwright global timeout ${deadline_ms}ms"
          fi
          echo "ms=${deadline_ms}" >> "$GITHUB_OUTPUT"

      - name: Full E2E smoke tests
        env:
          E2E_GLOBAL_TIMEOUT_MS: ${{ steps.e2e_deadline.outputs.ms }}
        # ONE worker per shard. A brief experiment with two workers made every
        # SwiftShader render compete for the 4-vCPU runner's CPU and starved
        # rendering-dependent tests into multi-minute timeouts (~60 failed,
        # including specs that pass at one worker in the Critical gate), so the
        # parallelism must come from separate shard jobs, not workers inside a
        # runner. Thirty-two shards of ~6 tests at one worker keep even a shard
        # that lands a cluster of the slow software-rendered specs well inside
        # the 35-minute budget, so no shard times out (the 16-shard sizing had
        # two shards with slow clusters run long). Add shards, never workers or
        # a bigger per-test cap, when the software renderer is the bottleneck
        # (F-131/F-132).
        run: pnpm test:e2e --project=chromium --fully-parallel --workers=1 --shard=${{ matrix.shard }}

      # Guarantee the failure upload is never empty (F-131). The HTML reporter
      # writes playwright-report/index.html on a normal or global-timeout
      # failure, but a crash after the reporter cleared its output dir and
      # before it wrote could leave nothing. Drop an explicit marker ONLY when
      # the HTML report is genuinely absent, so evidence loss can never be
      # silent: the artifact then still carries a named signal to triage.
      - name: Ensure failure evidence exists
        if: failure()
        run: |
          mkdir -p playwright-report
          if [ ! -f playwright-report/index.html ]; then
            echo "Full E2E shard ${{ matrix.shard }} failed with no HTML report. Playwright likely crashed before its reporter wrote; inspect the job log for the failing step." \
              > playwright-report/NO-REPORT.txt
          fi

      # Runs on any non-success shard, including a global-timeout failure. With
      # the internal deadline the shard fails (not cancelled) before the job
      # deadline, so this upload actually runs and the evidence survives (F-131).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-${{ matrix.shard_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # The prior step guarantees at least a NO-REPORT.txt marker exists, so
          # this upload is never empty. Warn (not ignore) is the backstop: if the
          # path ever did resolve to nothing, the log surfaces it instead of the
          # step silently succeeding with an empty artifact.
          if-no-files-found: warn

  visual-baselines-update:
    name: Update Visual Baselines
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Regenerate visual baselines
        run: pnpm exec playwright test tests/e2e/visual-baselines.spec.ts --project=chromium --workers=1 --update-snapshots
        env:
          UPDATE_VISUAL_BASELINES: "1"

      - name: Upload baselines artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual-baselines.spec.ts-snapshots/
          retention-days: 14
