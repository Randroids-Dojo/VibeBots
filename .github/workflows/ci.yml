name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full Playwright smoke matrix
        required: false
        default: "true"
      update_visual_baselines:
        description: Regenerate visual regression baselines (uploads artifact)
        required: false
        default: "false"
      full_e2e_global_timeout_ms:
        description: Override the Full E2E Playwright global timeout in ms (blank = auto from remaining job budget; set low to prove a timeout concludes as failure with artifacts)
        required: false
        default: ""
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dash check
        run: bash scripts/check-dashes.sh

      - name: Sim purity check
        run: bash scripts/check-sim-purity.sh

      - name: Whitespace check
        run: git diff --check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e-critical:
    name: Critical E2E (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            shard_name: 1-of-2
          - shard: "2/2"
            shard_name: 2-of-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Critical E2E smoke tests
        run: pnpm test:e2e:critical --project=chromium --fully-parallel --workers=1 --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ matrix.shard_name }}
          path: playwright-report/
          retention-days: 7

  e2e-full:
    name: Full E2E (${{ matrix.shard_name }})
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/4"
            shard_name: 1-of-4
          - shard: "2/4"
            shard_name: 2-of-4
          - shard: "3/4"
            shard_name: 3-of-4
          - shard: "4/4"
            shard_name: 4-of-4
    steps:
      # Anchor for the internal Playwright deadline (F-131). The whole job has a
      # 20-minute budget; the deadline is computed from how much of it remains
      # right before the tests run, so a slow or hung shard fails with a report
      # instead of being cancelled at the job deadline with zero evidence.
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Compute the Playwright global timeout from the job budget left after the
      # setup and build steps, reserving time for teardown, the HTML report, and
      # the artifact upload (F-131). A blank dispatch override auto-computes; a
      # low override forces a timeout to prove the failure-with-artifacts path.
      - name: Compute Playwright global timeout
        id: e2e_deadline
        env:
          OVERRIDE_MS: ${{ inputs.full_e2e_global_timeout_ms }}
        run: |
          if [ -n "$OVERRIDE_MS" ]; then
            echo "Using dispatch override: ${OVERRIDE_MS}ms"
            echo "ms=${OVERRIDE_MS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          job_budget_s=$(( 20 * 60 ))
          reserve_s=150   # teardown + HTML/JSON report + artifact upload
          elapsed_s=$(( $(date +%s) - JOB_START_EPOCH ))
          remain_ms=$(( (job_budget_s - reserve_s - elapsed_s) * 1000 ))
          if [ "$remain_ms" -lt 60000 ]; then remain_ms=60000; fi
          echo "Elapsed ${elapsed_s}s; Playwright global timeout ${remain_ms}ms"
          echo "ms=${remain_ms}" >> "$GITHUB_OUTPUT"

      - name: Full E2E smoke tests
        env:
          E2E_GLOBAL_TIMEOUT_MS: ${{ steps.e2e_deadline.outputs.ms }}
        run: pnpm test:e2e --project=chromium --fully-parallel --workers=1 --shard=${{ matrix.shard }}

      # Runs on any non-success shard, including a global-timeout failure. With
      # the internal deadline the shard fails (not cancelled) before the job
      # deadline, so this upload actually runs and the evidence survives (F-131).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-${{ matrix.shard_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  visual-baselines-update:
    name: Update Visual Baselines
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Regenerate visual baselines
        run: pnpm exec playwright test tests/e2e/visual-baselines.spec.ts --project=chromium --workers=1 --update-snapshots
        env:
          UPDATE_VISUAL_BASELINES: "1"

      - name: Upload baselines artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual-baselines.spec.ts-snapshots/
          retention-days: 14
